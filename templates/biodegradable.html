<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Waste Management Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.65)),
    url("https://images.unsplash.com/photo-1604186838309-c671b2f7e7c0?auto=format&fit=crop&w=1600&q=80") no-repeat center center/cover;
    background-size:cover;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-container{
    background:white;
    width:380px;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    text-align:center;
    
}

h2{
    color:#2e7d32;
    margin-bottom:5px;
}

.subtitle{
    font-size:14px;
    color:#555;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

input:focus{
    border-color:#2e7d32;
    outline:none;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1b5e20;
}

.language-btn{
    position:absolute;
    top:20px;
    right:20px;
    background:white;
    border:none;
    padding:6px 14px;
    border-radius:20px;
    cursor:pointer;
    font-weight:600;
}

.footer{
    margin-top:15px;
    font-size:12px;
    color:#777;
}

</style>
</head>

<body>

<button class="language-btn" onclick="toggleLanguage()">മലയാളം</button>

<div class="login-container">

<h2 id="title">Smart Waste Management Login</h2>
<div class="subtitle" id="subtitle">Kerala Carbon Footprint Monitoring System</div>

<form action="/login" method="POST">

<input type="email" name="email" placeholder="Registered Email Address" required>

<input type="password" name="password" placeholder="Password" required>

<input type="text" name="aadhaar" pattern="[0-9]{12}" maxlength="12"
placeholder="Aadhaar Number (12 digits)" required>

<button type="submit" id="loginBtn">Login</button>

<div style="margin-top:15px;">
    <a href="{{ url_for('register.html') }}" 
       style="text-decoration:none;color:#2e7d32;font-weight:600;">
        Create New Account
    </a>
</div>
</form>

<div class="footer" id="footerText">
Secure login. Your Aadhaar is encrypted and used only for verification.
</div>

</div>

<script>

let malayalam = false;

function toggleLanguage(){

malayalam = !malayalam;

if(malayalam){

document.querySelector(".language-btn").innerText="English";

document.getElementById("title").innerText="സ്മാർട്ട് മാലിന്യ മാനേജ്മെന്റ് ലോഗിൻ";
document.getElementById("subtitle").innerText="കേരള കാർബൺ ഫുട്പ്രിന്റ് നിരീക്ഷണ സംവിധാനം";

document.querySelector("input[name='email']").placeholder="രജിസ്റ്റർ ചെയ്ത ഇമെയിൽ വിലാസം";
document.querySelector("input[name='password']").placeholder="പാസ്വേഡ്";
document.querySelector("input[name='aadhaar']").placeholder="ആധാർ നമ്പർ (12 അക്കങ്ങൾ)";

document.getElementById("loginBtn").innerText="ലോഗിൻ ചെയ്യുക";

document.getElementById("footerText").innerText="സുരക്ഷിത ലോഗിൻ. നിങ്ങളുടെ ആധാർ നമ്പർ എൻക്രിപ്റ്റ് ചെയ്തിരിക്കുന്നു.";

}else{
location.reload();
}

}

</script>

</body>
</html>
