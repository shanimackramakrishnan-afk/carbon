<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Error — EcoScan</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0f0e;--green:#3ddc84;--text:#e8f0ec;--muted:#7a9488;
        --surface:#131918;--border:rgba(255,255,255,.07);--red:#e8453c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center}
  .box{background:var(--surface);border:1px solid rgba(232,69,60,.3);
       border-radius:16px;padding:48px 40px;text-align:center;max-width:440px;width:90%}
  h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--red);margin-bottom:12px}
  p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:24px}
  a{display:inline-block;background:var(--green);color:#000;padding:11px 28px;
    border-radius:10px;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <h1>Something went wrong</h1>
  <p>{{ message }}</p>
  <a href="/">Go back</a>
</div>
</body>
</html>
